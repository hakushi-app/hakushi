name: Bug report
description: Report a problem in Hakushi
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Never paste tokens/PATs, passwords, or private
        note contents.** Redact anything sensitive.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build / git backend
      options:
        - Desktop (git-libgit2)
        - Mobile (git-gix)
        - Not sure
  - type: dropdown
    id: editor
    attributes:
      label: Editor mode (if relevant)
      options:
        - "N/A"
        - WYSIWYG (TipTap)
        - Source (CodeMirror)
        - Rich view (Kanban/Calendar/Todo)
  - type: input
    id: version
    attributes:
      label: Hakushi version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console or terminal output, screenshots. Redact secrets.
      render: shell
