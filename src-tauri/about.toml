# cargo-about configuration for the Rust dependency license report.
# Regenerate with:
#   cargo install cargo-about
#   cd src-tauri && cargo about generate about.hbs > ../reports/rust-licenses.html
#
# Note: libgit2-sys and openssl-sys report MIT/Apache for the *binding* crate,
# but vendor C libraries under GPL-2.0-with-linking-exception (libgit2) and
# Apache-2.0 (OpenSSL 3.x). Those obligations are documented manually in
# ../THIRD_PARTY_LICENSES.md and ../NOTICE.

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BlueOak-1.0.0",
    "OpenSSL",
    "GPL-2.0 WITH GCC-exception-2.0",
]
