[package]
name = "hakushi"
version = "1.0.1"
description = "Hakushi — local-first, git-native Notion alternative"
edition = "2021"
license = "MIT"

[lib]
name = "hakushi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Desktop git backend: libgit2. M7 enables https via the `git-libgit2`
# feature list below (git2/https + vendored openssl/libgit2 for OS-uniform
# builds). SSH stays off (M7 non-goal, docs/dev/M7-M8-PLAN.md §1.8). The
# git-gix (mobile) configuration never includes git2, so OpenSSL stays out of
# every mobile build.
git2 = { version = "0.21", optional = true, default-features = false }

# HTTPS PAT storage in the OS keychain (service "hakushi", account = host;
# docs/dev/M7-M8-PLAN.md §1.3). Pure-Rust / OS-framework backends only:
#   apple-native   — macOS Keychain (and the iOS keychain, same framework)
#   windows-native — Windows Credential Manager
#   linux-native   — kernel keyutils (pure Rust; avoids a libdbus/
#                    secret-service C dependency in CI. Session-persistent
#                    only — a secret-service upgrade is a v2 follow-up.)
# Android matches no backend and falls back to keyring's in-memory mock,
# which is fine: Android sync stays unsupported/pull-only in M7.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }

# Mobile git backend: gitoxide (pure Rust). default-features = false and NO
# network/TLS features (network comes in M7) to maximize iOS/Android
# portability. Minimal local-op feature set (see docs/dev/M0-SPIKE-RESULTS.md):
#   sha1        — object hashing (required to write any object)
#   status      — Repository::status (index<->worktree + dirwalk for untracked)
#   tree-editor — Repository::edit_tree, used to build commit trees
gix = { version = "0.85.0", optional = true, default-features = false, features = [
    "sha1",
    "status",
    "tree-editor",
    # M7 TLS spike (docs/dev/M7-M8-PLAN.md §1.7): pure-Rust https fetch.
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
# Link index store (.hakushi/index.db). "bundled" compiles SQLite from source
# so iOS/Android need no system sqlite; Android cross-compilation of the C
# amalgamation requires the NDK toolchain env (docs/dev/M0-SPIKE-RESULTS.md §5).
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Pure-Rust ULID generation (Welcome page id). Uppercase Crockford base32,
# matching templates/ and the TS `ulid()` output.
ulid = "1.2.1"

[features]
# Desktop default. Mobile builds use: --no-default-features --features git-gix
default = ["git-libgit2"]
# M7 (docs/dev/M7-M8-PLAN.md §1.2): https transport for fetch/push/clone.
# vendored-openssl + vendored-libgit2 keep the build self-contained on all
# three desktop OSes (no system openssl/libgit2 needed; CI only runs check).
git-libgit2 = [
    "dep:git2",
    "git2/https",
    "git2/vendored-openssl",
    "git2/vendored-libgit2",
]
git-gix = ["dep:gix"]

[profile.release]
codegen-units = 1
lto = true
strip = true
